@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070F22; --surface:#0F1B38; --surface-2:#13234A; --ink:#E7ECF8; --muted:#9AA8C6; --line:#24365F;
  --navy:#0A1E4D; --navy-2:#3F72E0; --on-navy:#FFFFFF; --on-navy-muted:#A9B8DD;
  --hazard:#F5C02A; --on-hazard:#1A1400;
  --ok:#4CC27E; --ok-bg:#0F2E20; --warn:#F0B24A; --warn-bg:#33240A; --bad:#FF7A6E; --bad-bg:#3A1513;
  --bar-plan:#2A3D6B; --accent-ink:#8FB0FF; --glass:rgba(15,27,56,.80); --gridline:rgba(143,176,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070F22; --surface:#0F1B38; --surface-2:#13234A; --ink:#E7ECF8; --muted:#9AA8C6; --line:#24365F;
  --navy:#0A1E4D; --navy-2:#3F72E0; --on-navy:#FFFFFF; --on-navy-muted:#A9B8DD;
  --hazard:#F5C02A; --on-hazard:#1A1400;
  --ok:#4CC27E; --ok-bg:#0F2E20; --warn:#F0B24A; --warn-bg:#33240A; --bad:#FF7A6E; --bad-bg:#3A1513;
  --bar-plan:#2A3D6B; --accent-ink:#8FB0FF; --glass:rgba(15,27,56,.80); --gridline:rgba(143,176,255,.06); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.lbl{font-family:var(--f-label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--muted)}
:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.12em;line-height:1}
.brand span{display:block;font-family:var(--f-label);font-size:11px;letter-spacing:.24em;color:var(--on-navy-muted)}
.sel{display:flex;align-items:center;gap:8px;min-width:0}
.sel select{max-width:min(320px,62vw)}
.top select{background:rgba(255,255,255,.1);color:var(--on-navy);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:8px 10px;font:inherit;font-weight:600}
.top select option{color:#0B1A3A;background:#fff}
.save{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-navy-muted)}
.tape{height:6px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,#111 12px 24px)}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,62px));z-index:15}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px 10px;font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hazard)}

main{padding-block:20px 60px}
.view{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h2{font-family:var(--f-label);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:30px;line-height:1.1;margin-top:4px}
.kpi .s{font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:var(--navy-2);color:#fff;line-height:1.1}
.btn.sec{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.hz{background:var(--hazard);color:var(--on-hazard)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;font-size:16px;border-radius:4px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--muted);text-align:left;padding:9px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface-2)}
tr.sel-row td{background:color-mix(in srgb,var(--hazard) 14%,var(--surface))}
td input,td select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:5px 7px;width:100%;min-width:90px}
td input[type=number]{text-align:right;font-variant-numeric:tabular-nums}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neu{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.meter{height:8px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden;min-width:90px;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--navy-2);border-radius:4px}
.meter i.bad{background:var(--bad)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
.f.full{grid-column:1/-1}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-weight:600}
.banner.info{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* Gantt */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.g-inner{position:relative}
.g-row{display:flex;border-bottom:1px solid var(--line);min-height:40px}
.g-row:last-child{border-bottom:0}
.g-name{flex:none;width:210px;position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:8px 10px;font-size:13px;font-weight:600;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.g-name small{font-weight:500;color:var(--muted)}
.g-track{position:relative;flex:none}
.g-head .g-name{background:var(--surface-2)}
.g-head .g-track{height:40px;background:var(--surface-2)}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:4px 4px 0;white-space:nowrap;font-family:var(--f-label);letter-spacing:.04em}
.g-tick.m{border-left-color:var(--muted);color:var(--ink);font-weight:700}
.g-bar{position:absolute;top:10px;height:20px;border-radius:4px;background:var(--bar-plan);overflow:hidden}
.g-bar i{position:absolute;inset:0 auto 0 0;background:var(--navy-2)}
.g-bar.late i{background:var(--bad)}
.g-bar.done i{background:var(--ok)}
.g-bar span{position:relative;z-index:1;font-size:11px;font-weight:700;color:#fff;padding:0 6px;line-height:20px;text-shadow:0 0 2px rgba(0,0,0,.5)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--hazard);z-index:1}
.g-today::after{content:"HOY";position:absolute;top:2px;left:4px;font-family:var(--f-label);font-weight:700;font-size:10px;color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* VSM */
.vsm{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.vsm svg text{font-family:var(--f-body)}

/* Auditorías */
.chk{display:grid;gap:8px}
.chk-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.chk-item p{margin:0;font-weight:600}
.chk-item small{color:var(--muted);display:block;font-weight:500}
.tri{display:flex;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.tri button{border:0;background:var(--surface-2);padding:7px 10px;font-family:var(--f-label);font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.tri button[aria-pressed="true"][data-v="ok"]{background:var(--ok);color:#fff}
.tri button[aria-pressed="true"][data-v="nok"]{background:var(--bad);color:#fff}
.tri button[aria-pressed="true"][data-v="na"]{background:var(--muted);color:var(--surface)}
.chk-item input{grid-column:1/-1;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
@media (max-width:520px){.chk-item{grid-template-columns:1fr}}
.hist{display:grid;gap:8px}
.hist details{border:1px solid var(--line);border-radius:6px;padding:0 12px;background:var(--surface)}
.hist summary{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;cursor:pointer;list-style:none}
.hist ul{margin:0 0 12px;padding-left:18px;color:var(--muted)}

/* Modal */
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,12,30,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:10px;width:min(680px,100%);max-height:88vh;overflow:auto;padding:20px;display:grid;gap:16px}
.modal h3{font-family:var(--f-label);font-weight:700;font-size:22px;text-transform:uppercase}
.mact{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.stars{color:var(--hazard);letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ===== Capa visual (benchmark) ===== */

.panel,.kpi{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1);border-radius:16px;box-shadow:0 26px 50px -38px rgba(11,26,58,.45)}
.kpi{border-radius:14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hazard);opacity:.9}
.kpi .v{font-family:var(--f-mono);font-weight:700;letter-spacing:-.03em;font-size:28px}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.12,.9)}50%{transform:scale(.95,1.05)}70%{transform:scale(1.02,.98)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
@media (prefers-reduced-motion:no-preference){
  .btn:active,.tabs button:active,.tri button:active{animation:jelly .45s}
  .brand:hover svg{animation:jelly .7s}
  .kpi,.panel{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
  .g-bar i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
}
/* Selector 3D de proyectos */
.pring{position:relative;height:274px;perspective:1000px;perspective-origin:50% 30%;overflow:hidden;cursor:grab;touch-action:pan-y;outline:none;border-radius:16px;margin-bottom:6px}
.pring.dragging{cursor:grabbing}
.pring:focus-visible{box-shadow:inset 0 0 0 3px var(--hazard)}
.pring .ring{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d}
.pring .floor{position:absolute;left:50%;bottom:0;width:min(640px,96%);height:70px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(26,71,168,.28),rgba(242,183,5,.08) 62%,transparent);pointer-events:none}
.pc{position:absolute;left:0;top:0;width:var(--cw);margin-left:calc(var(--cw)/-2);margin-top:-106px;height:212px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-content:start;user-select:none;-webkit-user-select:none;box-shadow:0 24px 30px -22px rgba(11,26,58,.55);overflow:hidden}
.pc::after{content:"";position:absolute;inset:0;background:#081226;opacity:var(--shade,0);pointer-events:none;border-radius:inherit}
.pc.front{box-shadow:0 0 0 2px var(--hazard),0 30px 40px -24px rgba(11,26,58,.6)}
.pc h4{margin:0;font-family:var(--f-label);font-weight:700;font-size:clamp(15px,4.2vw,18px);text-transform:uppercase;line-height:1.1;letter-spacing:.02em}
.pc small{color:var(--muted);font-size:13px;grid-column:1}
.pc .donut{grid-row:1/3;grid-column:2}
.pc .donut text{font-family:var(--f-mono);font-weight:700}
.pc .pills{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pc .money{grid-column:1/-1;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pc .money b{color:var(--ink)}
.pring-ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:16px}
.pring-ctl button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer}
.pring-ctl span{font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}

html.locked .top,html.locked .tabs,html.locked main{display:none}
.gate{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--navy);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px}
html.locked .gate{display:flex}
.gcard{width:min(420px,100%);background:var(--surface);color:var(--ink);border-radius:20px;padding:28px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);display:grid;gap:16px;position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,#111 14px 28px)}
.glogo{width:150px;height:96px;margin:6px auto 0;background:var(--navy);-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat}
:root[data-theme="dark"] .glogo{background:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .glogo{background:#fff}}
.gcard h1{font-family:var(--f-label);font-size:26px;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.gcard p{margin:0;color:var(--muted);font-size:14px;text-align:center}
.gcard .f input{font-size:16px}
.gcard .btn{width:100%;justify-content:center;padding:12px}
.gmsg{font-size:14px;font-weight:600;color:var(--bad);text-align:center}
.gmsg.ok{color:var(--ok)}
.uidbox{display:flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:12px;word-break:break-all}
.gsteps{margin:0;padding-left:20px;color:var(--muted);font-size:13px;display:grid;gap:4px;text-align:left}
.gsteps b{color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-navy-muted)}
.who b{color:var(--on-navy);font-weight:600}
.who a,.who button{background:rgba(255,255,255,.12);color:var(--on-navy);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:6px 10px;font:inherit;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
.tabs button .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--hazard);color:var(--on-hazard);font-family:var(--f-mono);font-size:11px}
.sol{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.sol pre{grid-column:1/-1;margin:0;white-space:pre-wrap;font:13px/1.5 var(--f-body);color:var(--muted);max-height:150px;overflow:auto;background:var(--surface-2);border-radius:8px;padding:10px}
.sol h3{font-family:var(--f-label);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.sol .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:4px}
.sol select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.sol-list{display:grid;gap:10px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chipsel button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.chipsel button[aria-pressed="true"]{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.busy{opacity:.6;pointer-events:none}

/* Archivos dentro de Firestore, en partes (sin Firebase Storage, plan gratuito) */
const PARTE=700000, ARCH={};
async function b64De(blob){const u=new Uint8Array(await blob.arrayBuffer());let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function subirArchivo(blob,meta){
  const b64=await b64De(blob),n=Math.max(1,Math.ceil(b64.length/PARTE)),ref=FB.db.collection('archivos').doc();
  for(let i=0;i<n;i++)await ref.collection('partes').doc(String(i)).set({d:b64.slice(i*PARTE,(i+1)*PARTE)});
  await ref.set({nombre:String(meta.nombre||'archivo').slice(0,120),tipo:blob.type||meta.tipo||'application/octet-stream',tam:blob.size,partes:n,publico:!!meta.publico,creado:TS(),por:FB.auth.currentUser?FB.auth.currentUser.uid:''});
  ARCH[ref.id]=Promise.resolve(URL.createObjectURL(blob));return ref.id}
function urlArchivo(id){
  if(!ARCH[id]){ARCH[id]=(async()=>{const r=FB.db.collection('archivos').doc(id);const m=await r.get();if(!m.exists)throw new Error('El archivo ya no existe');const md=m.data();
    const ps=await Promise.all(Array.from({length:md.partes},(_,i)=>r.collection('partes').doc(String(i)).get()));
    const bin=atob(ps.map(p=>p.data().d).join(''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u],{type:md.tipo}))})();ARCH[id].catch(()=>{delete ARCH[id]})}
  return ARCH[id]}
async function borrarArchivo(id){if(!id||!FB.ok)return;try{const r=FB.db.collection('archivos').doc(id);const m=await r.get();const n=m.exists?(m.data().partes||0):0;for(let i=0;i<n;i++)await r.collection('partes').doc(String(i)).delete();await r.delete()}catch(e){console.warn(e)}delete ARCH[id]}
async function marcarPublico(id,pub){if(!id)return;try{await FB.db.collection('archivos').doc(id).update({publico:!!pub})}catch(e){console.warn(e)}}
function hidratar(root){(root||document).querySelectorAll('img[data-arch]:not([src])').forEach(img=>{urlArchivo(img.dataset.arch).then(u=>{img.src=u}).catch(()=>{img.alt='Foto no disponible';img.removeAttribute('data-arch')})})}
async function abrirArchivo(id){
  const w=window.open('','_blank');
  try{if(w)w.document.write('<title>Documento</title><p style="font:16px system-ui,sans-serif;padding:24px">Cargando documento…</p>');
    const u=await urlArchivo(id);
    if(w)w.location.href=u;else{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}}
  catch(e){if(w)w.close();toast('No se pudo abrir el documento: '+errTxt(e))}}

  const pres=sumP(p,'presupuesto'), ej=sumP(p,'ejercido');
  const pctE=pres?ej/pres*100:0, av=avance(p);
  const atr=p.tareas.filter(late).length;
  const costo= pctE-av>10||ej>pres ? 'bad' : pctE-av>3 ? 'warn':'ok';
  const tiempo= atr>0 ? (atr>1?'bad':'warn') : (planeado(p)-av>10?'warn':'ok');
  return {pres,ej,pctE,av,atr,costo,tiempo};
}

function markDirty(){dirty=true;updSave()}
function updSave(){
  const st=$('#saveState'), b=$('#saveBtn');
  if(canSave===false){st.textContent='Solo lectura: los cambios no se guardan';b.hidden=true;return}
  if(dirty){st.textContent='Cambios sin guardar';b.hidden=false}else{st.textContent='Todo guardado';b.hidden=true}

async function save(){
  if(!REF){toast('Aún no hay conexión con la base de datos');return}
  const b=$('#saveBtn');b.disabled=true;$('#saveState').textContent='Guardando…';
  try{
    for(const e of S.empleados){const k=String(e.docContrato||'');if(k.startsWith('pend:')&&PEND[k]){$('#saveState').textContent='Subiendo contrato '+e.num+'…';e.docContrato=await subirArchivo(PEND[k],{nombre:'Contrato '+e.num+'.pdf',publico:false});delete PEND[k]}}
    const json=JSON.stringify(S);if(json.length>950000)throw {message:'Los datos ya ocupan casi 1 MB. Elimina o archiva proyectos terminados antes de guardar.'};
    let nuevo=0;
    await FB.db.runTransaction(async t=>{const snap=await t.get(REF);const cur=snap.exists?(snap.data().rev||0):0;if(cur!==rev)throw {code:'conflicto',data:snap.data()};nuevo=cur+1;
      t.set(REF,{json,rev:nuevo,actualizado:TS(),por:ME.email||ME.uid})});
    rev=nuevo;dirty=false;remoto=null;toast('Guardado');
    while(POR_BORRAR.length)borrarArchivo(POR_BORRAR.pop());
    render();
  }catch(e){
    if(e&&e.code==='conflicto'){remoto=e.data;renderBanner();toast('Otra persona guardó antes que tú. Elige qué versión conservar.')}
    else toast('No se pudo guardar: '+errTxt(e));
  }finally{b.disabled=false;updSave()}
}$('#saveBtn').addEventListener('click',save);

/* ---------- B) Gantt ---------- */
function ganttHTML(p){
  if(!p.tareas.length) return '<div class="empty">Este proyecto no tiene actividades. Agrega la primera para ver el diagrama.</div>';
  const starts=p.tareas.map(t=>t.inicio).concat([p.inicio]).filter(Boolean).sort();
  const ends=p.tareas.map(t=>t.fin).concat([p.fin]).filter(Boolean).sort();
  let a=D(starts[0]), b=D(ends[ends.length-1]);
  a=new Date(a.getTime()-2*DAY); b=new Date(b.getTime()+3*DAY);
  const days=Math.round((b-a)/DAY);
  const px=days>150?5:days>70?10:days>30?20:30;
  const W=days*px, x=s=>Math.round((D(s)-a)/DAY)*px;
  let ticks='';
  for(let d=new Date(a);d<=b;d=new Date(d.getTime()+DAY)){
    const L=Math.round((d-a)/DAY)*px;
    if(d.getDate()===1) ticks+='<div class="g-tick m" style="left:'+L+'px">'+MESES[d.getMonth()].toUpperCase()+' '+String(d.getFullYear()).slice(2)+'</div>';
    else if(px>=10&&d.getDay()===1) ticks+='<div class="g-tick" style="left:'+L+'px;top:18px">'+d.getDate()+'</div>';
  }
  const today=(TODAY>=iso(a)&&TODAY<=iso(b))?'<div class="g-today" style="left:'+(210+x(TODAY))+'px"></div>':'';
  const rows=p.tareas.map(t=>{const L=x(t.inicio), w=Math.max(px,(diff(t.inicio,t.fin)+1)*px);
    const cls=t.avance>=100?'done':late(t)?'late':'';
    return `<div class="g-row"><div class="g-name">${esc(t.nombre)}<small>${esc(t.responsable||'')}${late(t)?' · <span style="color:var(--bad)">atrasada '+diff(t.fin,TODAY)+' d</span>':''}</small></div>
    <div class="g-track" style="width:${W}px"><div class="g-bar ${cls}" style="left:${L}px;width:${w}px" title="${esc(t.nombre)}: ${fmtD(t.inicio)} – ${fmtD(t.fin)}, ${t.avance}%"><i style="width:${t.avance}%"></i><span>${t.avance}%</span></div></div></div>`}).join('');
  return `<div class="gantt"><div class="g-inner" style="width:${210+W}px">${today}
    <div class="g-row g-head"><div class="g-name">Actividad</div><div class="g-track" style="width:${W}px">${ticks}</div></div>${rows}</div></div>
    <div class="legend"><span><i style="background:var(--bar-plan)"></i>Plan</span><span><i style="background:var(--navy-2)"></i>Avance</span><span><i style="background:var(--ok)"></i>Terminada</span><span><i style="background:var(--bad)"></i>Atrasada</span><span><i style="background:var(--hazard)"></i>Hoy</span></div>`;
}
function vGantt(v){
  const p=P(); if(!p){v.innerHTML='<div class="empty">Crea un proyecto en Presupuesto.</div>';return}
  const done=p.tareas.filter(t=>t.avance>=100).length, atr=p.tareas.filter(late).length;
  const enT=p.tareas.filter(t=>!late(t)).length;
  const cumpl=p.tareas.length?Math.round(enT/p.tareas.length*100):0;
  const av=avance(p), pl=planeado(p);
  const finEst=(()=>{ // fecha estimada por ritmo
    const el=diff(p.inicio,TODAY); if(el<=0||av<=0) return null;
    const tot=el/(av/100); const d=new Date(D(p.inicio).getTime()+tot*DAY); return iso(d)})();
  v.insertAdjacentHTML('beforeend',`<div class="kpis">
    <div class="kpi"><span class="lbl">Cumplimiento en tiempo</span><div class="v num" style="color:${cumpl<80?'var(--bad)':cumpl<95?'var(--warn)':'var(--ok)'}">${cumpl}%</div><div class="s">actividades sin atraso</div></div>
    <div class="kpi"><span class="lbl">Avance real vs plan</span><div class="v num">${Math.round(av)}% <small style="font-size:16px;color:var(--muted)">/ ${Math.round(pl)}%</small></div><div class="s">${av>=pl?'adelantado o en plan':'desfase de '+Math.round(pl-av)+' puntos'}</div></div>
    <div class="kpi"><span class="lbl">Actividades</span><div class="v num">${done}/${p.tareas.length}</div><div class="s">${atr} atrasada${atr===1?'':'s'}</div></div>
    <div class="kpi"><span class="lbl">Fin comprometido</span><div class="v num" style="font-size:24px">${fmtD(p.fin)}</div><div class="s">${finEst?'al ritmo actual: '+fmtD(finEst):'sin datos de ritmo'}</div></div></div>
  <section class="panel"><div class="ph"><div><span class="lbl">Cronograma</span><h2>${esc(p.nombre)}</h2></div></div>${ganttHTML(p)}</section>`);
  const rows=p.tareas.map(t=>`<tr data-id="${t.id}">
    <td><input data-f="nombre" value="${esc(t.nombre)}" aria-label="Actividad"></td>
    <td><input type="date" data-f="inicio" value="${t.inicio}" aria-label="Inicio"></td>
    <td><input type="date" data-f="fin" value="${t.fin}" aria-label="Fin"></td>
    <td style="min-width:90px"><input type="number" min="0" max="100" step="5" data-f="avance" value="${t.avance}" aria-label="Avance %"></td>
    <td><input data-f="responsable" value="${esc(t.responsable||'')}" aria-label="Responsable"></td>
    <td style="white-space:nowrap"><button class="icon-btn" data-mv="-1" aria-label="Subir" type="button">↑</button><button class="icon-btn" data-mv="1" aria-label="Bajar" type="button">↓</button><button class="icon-btn" data-del="1" aria-label="Eliminar" type="button">✕</button></td></tr>`).join('');
  v.insertAdjacentHTML('beforeend',`<section class="panel"><div class="ph"><div><h2>Actividades</h2><p>Actualiza el avance de cada actividad y el diagrama se recalcula.</p></div><button class="btn" id="addT" type="button">+ Actividad</button></div>
  <div class="tw"><table id="tTbl"><thead><tr><th>Actividad</th><th>Inicio</th><th>Fin</th><th class="r">Avance %</th><th>Responsable</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`);
  const tb=$('#tTbl');
  tb&&tb.addEventListener('change',e=>{const i=e.target,r=i.closest('tr');if(!i.dataset.f)return;const t=p.tareas.find(q=>q.id===r.dataset.id);
    let val=i.type==='number'?Math.max(0,Math.min(100,+i.value||0)):i.value; t[i.dataset.f]=val;
    if(t.fin<t.inicio){t.fin=t.inicio} markDirty();render()});
  tb&&tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=b.closest('tr');const ix=p.tareas.findIndex(q=>q.id===r.dataset.id);
    if(b.dataset.del){p.tareas.splice(ix,1)}else{const j=ix+(+b.dataset.mv);if(j<0||j>=p.tareas.length)return;const [it]=p.tareas.splice(ix,1);p.tareas.splice(j,0,it)}markDirty();render()});
  $('#addT').onclick=()=>{const last=p.tareas[p.tareas.length-1];const ini=last?last.fin:p.inicio;p.tareas.push({id:uid(),nombre:'Nueva actividad',inicio:ini,fin:iso(new Date(D(ini).getTime()+7*DAY)),avance:0,responsable:''});markDirty();render()};
}

/* ---------- C) VSM ---------- */
function vsmSVG(steps){
  if(!steps.length) return '<div class="empty">Agrega los pasos del flujo de valor de este proyecto.</div>';
  const bw=150,gap=58,x0=24,W=x0*2+steps.length*bw+(steps.length-1)*gap+60, H=330;
  const css=getComputedStyle(document.documentElement), c=k=>css.getPropertyValue(k).trim();
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de flujo de valor">`;
  // cliente
  s+=`<text x="${x0}" y="22" font-size="12" font-weight="700" fill="${c('--muted')}" letter-spacing="1.5">CLIENTE → SOLICITUD</text>`;
  steps.forEach((st,i)=>{
    const x=x0+i*(bw+gap), y=40;
    const fill=st.va?c('--navy-2'):c('--surface');
    const tc=st.va?'#FFFFFF':c('--ink');
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="58" rx="4" fill="${fill}" stroke="${st.va?c('--navy-2'):c('--muted')}" stroke-width="1.5"/>`;
    const words=String(st.nombre).split(' ');let l1='',l2='';words.forEach(w=>{if((l1+' '+w).trim().length<=18&&!l2)l1=(l1+' '+w).trim();else l2=(l2+' '+w).trim()});
    if(l2.length>20)l2=l2.slice(0,19)+'…';
    s+=`<text x="${x+bw/2}" y="${y+(l2?26:34)}" text-anchor="middle" font-size="13" font-weight="700" fill="${tc}">${esc(l1)}</text>`;
    if(l2) s+=`<text x="${x+bw/2}" y="${y+43}" text-anchor="middle" font-size="13" font-weight="700" fill="${tc}">${esc(l2)}</text>`;
    // caja de datos
    s+=`<rect x="${x}" y="${y+64}" width="${bw}" height="74" rx="3" fill="${c('--surface')}" stroke="${c('--line')}"/>`;
    s+=`<text x="${x+10}" y="${y+84}" font-size="12" fill="${c('--muted')}">T. proceso</text><text x="${x+bw-10}" y="${y+84}" text-anchor="end" font-size="12" font-weight="700" fill="${c('--ink')}">${st.tp} d</text>`;
    s+=`<text x="${x+10}" y="${y+104}" font-size="12" fill="${c('--muted')}">Personal</text><text x="${x+bw-10}" y="${y+104}" text-anchor="end" font-size="12" font-weight="700" fill="${c('--ink')}">${st.personas}</text>`;
    s+=`<text x="${x+10}" y="${y+124}" font-size="12" fill="${c('--muted')}">Tipo</text><text x="${x+bw-10}" y="${y+124}" text-anchor="end" font-size="12" font-weight="700" fill="${st.va?c('--ok'):c('--warn')}">${st.va?'Agrega valor':'Necesario'}</text>`;
    // espera (triángulo) hacia el siguiente
    if(i<steps.length-1){
      const gx=x+bw+gap/2, gy=y+20;
      s+=`<line x1="${x+bw+2}" y1="${y+29}" x2="${x+bw+gap-4}" y2="${y+29}" stroke="${c('--muted')}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      s+=`<path d="M${x+bw+gap-10} ${y+24} L${x+bw+gap-3} ${y+29} L${x+bw+gap-10} ${y+34}Z" fill="${c('--muted')}"/>`;
    }
    const wy=y+168;
    // espera antes del paso siguiente: triángulo de inventario bajo la flecha
    if(st.espera>0){
      const tx=x+bw+gap/2; const ty=y+150;
      if(i<steps.length-1){
        s+=`<path d="M${tx} ${ty-26} L${tx+15} ${ty} L${tx-15} ${ty}Z" fill="${c('--hazard')}" stroke="${c('--on-hazard')}" stroke-width="1"/><text x="${tx}" y="${ty-6}" text-anchor="middle" font-size="12" font-weight="800" fill="${c('--on-hazard')}">I</text>`;
      }
    }
    // escalera de tiempos
    const ly=270;
    s+=`<line x1="${x}" y1="${ly+26}" x2="${x+bw}" y2="${ly+26}" stroke="${st.va?c('--ok'):c('--warn')}" stroke-width="3"/>`;
    s+=`<text x="${x+bw/2}" y="${ly+44}" text-anchor="middle" font-size="12" font-weight="700" fill="${c('--ink')}">${st.tp} d</text>`;
    if(i<steps.length-1 || st.espera>0){
      const ex=x+bw, ew=gap;
      s+=`<polyline points="${ex},${ly+26} ${ex},${ly} ${ex+ew},${ly} ${ex+ew},${ly+26}" fill="none" stroke="${c('--muted')}" stroke-width="1.5"/>`;
      s+=`<text x="${ex+ew/2}" y="${ly-6}" text-anchor="middle" font-size="12" fill="${c('--muted')}">${st.espera} d</text>`;
    }
  });
  s+=`<text x="${x0}" y="${262}" font-size="11" fill="${c('--muted')}" letter-spacing="1">LÍNEA DE TIEMPO: ARRIBA ESPERA · ABAJO PROCESO</text>`;
  s+='</svg>';
  return '<div class="vsm">'+s+'</div>';
}

function score(a){const v=Object.values(a.res);const ok=v.filter(x=>x==='ok').length,nok=v.filter(x=>x==='nok').length;return ok+nok?Math.round(ok/(ok+nok)*100):0}

    ${porEtapa.length?'<div style="display:grid;gap:10px;margin-bottom:16px">'+porEtapa.map(({k,l})=>{const sc=score(l);return `<div><div style="display:flex;justify-content:space-between;font-weight:600"><span>${AUD[k].n}</span><span class="num" style="color:${sc>=90?'var(--ok)':sc>=75?'var(--warn)':'var(--bad)'}">${sc}%</span></div><div class="meter"><i class="${sc<75?'bad':''}" style="width:${sc}%"></i><b style="left:90%"></b></div></div>`}).join('')+'</div>':''}

/* ---------- Modales ---------- */
function closeModal(){$('#modalRoot').innerHTML=''}
function formModal(title,fields,onSave,onDelete){
  const f=fields.map(([k,l,t,val,req,opts])=>{
    if(t==='select') return `<div class="f"><label for="m_${k}">${l}</label><select id="m_${k}" data-k="${k}">${opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}"${String(ov)===String(val||'')?' selected':''}>${esc(ol)}</option>`}).join('')}</select></div>`;
    if(t==='check') return `<div class="f"><label for="m_${k}">${l}</label><select id="m_${k}" data-k="${k}" data-b="1"><option value="1"${val?' selected':''}>Sí</option><option value="0"${!val?' selected':''}>No</option></select></div>`;
    if(t==='file') return `<div class="f full"><label for="m_${k}">${l}</label><input id="m_${k}" type="file" accept="application/pdf" data-file="1">${val?'<small style="color:var(--muted)">Ya hay un contrato adjunto; subir otro lo reemplaza.</small>':''}</div>`;
    return `<div class="f"><label for="m_${k}">${l}</label><input id="m_${k}" type="${t}" data-k="${k}" value="${esc(val||'')}"${req?' required':''}></div>`}).join('');
  $('#modalRoot').innerHTML=`<div class="ov" id="ov"><form class="modal" id="mf" novalidate><h3>${esc(title)}</h3><div class="form">${f}</div><p id="merr" style="color:var(--bad);margin:0;font-weight:600" hidden></p>
    <div class="mact">${onDelete?'<button type="button" class="btn danger" id="mdel" style="margin-right:auto">Eliminar</button>':''}<button type="button" class="btn sec" id="mcan">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form></div>`;
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
  $('#mcan').onclick=closeModal;
  if(onDelete)$('#mdel').onclick=()=>{closeModal();confirmBox('¿Eliminar este registro?','',onDelete)};
  const first=$('#mf input,#mf select');first&&first.focus();
  $('#mf').addEventListener('submit',e=>{e.preventDefault();const d={};let miss=[];
    e.target.querySelectorAll('[data-k]').forEach(i=>{d[i.dataset.k]=i.dataset.b?i.value==='1':i.value;if(i.required&&!i.value.trim())miss.push(i.previousElementSibling.textContent)});
    const fi=e.target.querySelector('[data-file]');if(fi&&fi.files[0]){if(fi.files[0].size>8e6){showErr('El PDF pasa de 8 MB; comprímelo e inténtalo de nuevo.');return}d._file=fi.files[0]}
    if(miss.length){showErr('Falta: '+miss.join(', '));return}
    closeModal();onSave(d)});
  function showErr(m){const p=$('#merr');p.textContent=m;p.hidden=false}
}
function confirmBox(t,msg,ok){
  $('#modalRoot').innerHTML=`<div class="ov" id="ov"><div class="modal" role="alertdialog" aria-label="${esc(t)}"><h3>${esc(t)}</h3>${msg?'<p style="margin:0;color:var(--muted)">'+esc(msg)+'</p>':''}<div class="mact"><button class="btn sec" id="cn" type="button">Cancelar</button><button class="btn danger" id="cy" type="button">Sí, eliminar</button></div></div></div>`;
  $('#cn').onclick=closeModal;$('#cy').onclick=()=>{closeModal();ok()};$('#cy').focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- Selector 3D de proyectos ---------- */
const PR=(function(){
  const stage=$('#pring'),ring=$('#pr'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rot=0,target=0,drag=null,R=260,cw=260,N=1,STEP=360,cards=[];
  function donut(p){const r=22,c=2*Math.PI*r,a=Math.round(avance(p));const s=salud(p);const col=s.costo==='bad'||s.tiempo==='bad'?'var(--bad)':s.costo==='warn'||s.tiempo==='warn'?'var(--warn)':'var(--ok)';
    return `<svg class="donut" width="58" height="58" viewBox="0 0 58 58" aria-label="Avance ${a}%"><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*a/100} ${c}" transform="rotate(-90 29 29)"/><text x="29" y="33" text-anchor="middle" font-size="12" fill="var(--ink)">${a}%</text></svg>`}
  function build(){
    N=S.proyectos.length;STEP=360/Math.max(N,1);
    ring.innerHTML=S.proyectos.map((p,i)=>{const s=salud(p);return `<div class="pc" data-i="${i}"><h4>${esc(p.nombre)}</h4>${donut(p)}<small>${esc(p.tipo)} · ${esc(p.ubicacion||'—')}</small>
      <div class="pills">${pill(s.costo,s.costo==='ok'?'Costo OK':s.costo==='warn'?'Vigilar costo':'Sobrecosto')}${pill(s.tiempo,s.tiempo==='ok'?'A tiempo':s.atr?s.atr+' atrasada'+(s.atr>1?'s':''):'Vigilar')}</div>
      <div class="money">Ejercido <b>${moneyK(s.ej)}</b> de ${moneyK(s.pres)}</div></div>`}).join('');
    cards=[...ring.children];size();
    const si=S.proyectos.findIndex(p=>p.id===sel);if(!drag&&si>=0&&front()!==si){target=nearest(si);if(RM){rot=target;apply()}}
  }
  function nearest(i){return -i*STEP+Math.round((rot+i*STEP)/360)*360}
  function size(){const w=stage.clientWidth||600;cw=Math.min(270,w*.7);R=N<3?Math.round(cw*.75):Math.max(Math.round(cw*.95),Math.round(cw/2/Math.tan(Math.PI/N)*1.5));
    cards.forEach(c=>c.style.setProperty('--cw',cw+'px'));apply()}
  function front(){if(N<=1)return 0;let k=Math.round(-rot/STEP)%N;return (k+N)%N}
  function apply(){ring.style.transform=`rotateX(-6deg) translateZ(${-R}px) rotateY(${rot}deg)`;const f=front();
    cards.forEach((c,i)=>{const a=((i*STEP+rot)%360+540)%360-180;c.style.transform=`rotateY(${i*STEP}deg) translateZ(${R}px) rotateY(${-a*.75}deg)`;
      c.style.setProperty('--shade',Math.min(.75,(1-Math.cos(a*Math.PI/180))/2*.95).toFixed(2));c.style.visibility=Math.abs(a)>150&&N>2?'hidden':'visible';c.classList.toggle('front',i===f)})}
  function settle(){const f=front();const id=S.proyectos[f]&&S.proyectos[f].id;if(id&&id!==sel){sel=id;audDraft=null;renderSel();render()}}
  function tick(){if(!drag){const d=target-rot;if(Math.abs(d)>.05){rot+=d*.14;apply();if(Math.abs(target-rot)<=.05){rot=target;apply();settle()}}}requestAnimationFrame(tick)}
  function go(d){target=Math.round(target/STEP)*STEP-d*STEP;if(RM){rot=target;apply();settle()}}
  stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,r:rot,m:0,t:e.target};stage.classList.add('dragging')});
  addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.m=Math.max(drag.m,Math.abs(dx));rot=drag.r+dx*.3;apply()});
  addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;stage.classList.remove('dragging');
    if(d.m<6){const c=d.t.closest('.pc');if(c){target=nearest(+c.dataset.i)}}else target=Math.round(rot/STEP)*STEP;
    if(RM||Math.abs(target-rot)<=.05){rot=target;apply();settle()}});
  stage.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){go(1);e.preventDefault()}if(e.key==='ArrowLeft'){go(-1);e.preventDefault()}});
  $('#prNext').onclick=()=>go(1);$('#prPrev').onclick=()=>go(-1);
  new ResizeObserver(size).observe(stage);requestAnimationFrame(tick);
  return {build};
})();

function aplicar(obj){S=obj||{};S.proyectos=S.proyectos||[];S.empleados=S.empleados||[];S.subcontratistas=S.subcontratistas||[];
  if(!S.proyectos.length)S.proyectos.push(nuevoProyecto());
  if(!sel||!S.proyectos.some(p=>p.id===sel))sel=S.proyectos[0].id;renderSel();render()}

  if(estado==='sinacceso'){c.innerHTML=logo+`<h1>Cuenta sin acceso</h1><p>Entraste como <b>${esc(user.email||'')}</b>, pero esta cuenta aún no está dada de alta en el equipo de Armada.</p>
    <div><p style="text-align:left;margin-bottom:6px">Tu código de usuario (UID):</p><div class="uidbox"><span id="uidTxt" style="flex:1">${esc(user.uid)}</span><button class="btn sm sec" type="button" id="uidCopy" style="width:auto">Copiar</button></div></div>
    <p style="text-align:left">Compártelo con un administrador para que te dé acceso desde la pestaña Accesos.</p>
    <details><summary style="cursor:pointer;font-size:13px;color:var(--muted)">¿Eres el primer administrador?</summary><ol class="gsteps" style="margin-top:8px"><li>Abre Firebase → Firestore Database → Datos.</li><li>Crea la colección <b>staff</b>.</li><li>ID del documento: tu UID de arriba.</li><li>Campos: <b>rol</b> = admin, <b>nombre</b> = tu nombre, <b>email</b> = tu correo.</li><li>Vuelve aquí y pulsa Reintentar.</li></ol></details>
    <div style="display:grid;gap:8px"><button class="btn" type="button" onclick="location.reload()">Reintentar</button><button class="btn sec" type="button" id="gOut">Salir</button></div>`;
    $('#uidCopy').onclick=()=>{try{navigator.clipboard.writeText(user.uid).then(()=>toast('UID copiado')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#uidTxt'));getSelection().removeAllRanges();getSelection().addRange(r)})}catch(_){}};
    $('#gOut').onclick=()=>FB.auth.signOut();return}
  c.innerHTML=logo+`<h1>Portal de Gestión</h1><p>Acceso exclusivo para el equipo de Armada.</p>
    <form class="form" id="gForm" novalidate style="grid-template-columns:1fr">
      <div class="f"><label for="g_e">Correo</label><input id="g_e" type="text" inputmode="email" autocomplete="username"></div>
      <div class="f"><label for="g_p">Contraseña</label><input id="g_p" type="password" autocomplete="current-password"></div>
      <p class="gmsg" id="gMsg" ${msg?'':'hidden'}>${esc(msg||'')}</p>
      <button class="btn" type="submit">Entrar</button>
      <button class="btn sec" type="button" id="gReset">Olvidé mi contraseña</button>
    </form>`;
  const m=(t,ok)=>{const p=$('#gMsg');p.textContent=t;p.hidden=!t;p.classList.toggle('ok',!!ok)};
  $('#gForm').onsubmit=async e=>{e.preventDefault();const f=e.target;f.classList.add('busy');m('');
    try{await FB.auth.signInWithEmailAndPassword($('#g_e').value.trim(),$('#g_p').value)}catch(x){m(errTxt(x))}finally{f.classList.remove('busy')}};
  $('#gReset').onclick=async()=>{const em=$('#g_e').value.trim();if(!em){m('Escribe tu correo y vuelve a pulsar “Olvidé mi contraseña”.');return}
    try{await FB.auth.sendPasswordResetEmail(em);m('Te enviamos un correo para cambiar tu contraseña.',true)}catch(x){m(errTxt(x))}};
  setTimeout(()=>{const i=$('#g_e');if(i)i.focus()},50);
}
function iniciarDatos(){
  REF=FB.db.collection('gestion').doc('datos');
  unsub=REF.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(!snap.exists){
      if(S)return;
      if(ME.rol==='admin'){const ej=JSON.parse(JSON.stringify(EMB));REF.set({json:JSON.stringify(ej),rev:1,actualizado:TS(),por:ME.email||ME.uid}).catch(e=>{toast(errTxt(e));rev=0;aplicar(ej)})}
      else{rev=0;aplicar({proyectos:[],empleados:[],subcontratistas:[]})}
      return}
    const d=snap.data();if(d.rev===rev&&S)return;
    if(dirty){remoto=d;renderBanner();return}
    rev=d.rev||0;remoto=null;aplicar(JSON.parse(d.json||'{}'));updSave();
  },e=>{toast('No se pudieron leer los datos: '+errTxt(e));$('#view').innerHTML='<div class="empty">No se pudieron leer los datos. '+esc(errTxt(e))+'</div>'});
}
function limpiar(){if(unsub){unsub();unsub=null}S=null;REF=null;rev=0;remoto=null;dirty=false;SOL=null;STAFF=null;ME=null;
  $('#view').innerHTML='<div class="empty">Cargando datos de obra…</div>';Object.keys(PEND).forEach(k=>delete PEND[k])}
let salirArmado=false;
$('#logoutBtn').onclick=async()=>{if(dirty&&!salirArmado){salirArmado=true;toast('Tienes cambios sin guardar. Pulsa Salir otra vez para salir sin guardarlos.');setTimeout(()=>salirArmado=false,5000);return}
  dirty=false;try{await FB.auth.signOut()}catch(e){toast(errTxt(e))}};
async function boot(){
  try{tab=sessionStorage.getItem('armadaTab')||tab}catch(_){}
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===tab?'true':'false'));
  if(!FB.ok){gate('offline');return}
  gate('cargando');
  FB.auth.onAuthStateChanged(async u=>{
    limpiar();
    if(!u){gate('login');return}
    gate('cargando');ME=await perfilStaff(u);
    if(!ME){gate('sinacceso',u);return}
    document.documentElement.classList.remove('locked');
    $('#whoName').textContent=ME.nombre||ME.email||'';
    $('#tabAccesos').hidden=ME.rol!=='admin';
    if(tab==='accesos'&&ME.rol!=='admin')tab='presupuesto';
    document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===tab?'true':'false'));
    canSave=null;updSave();setTopH();
    iniciarDatos();cargarSol();
  });
}
boot();
})();
</script>
